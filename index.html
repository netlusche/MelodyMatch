<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MelodyMatch</title>
    <meta name="description" content="A fast-paced, modern local multiplayer music quiz using real iTunes songs. Guess the title, artist, and year to crown a winner!">
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="MelodyMatch: The Ultimate Music Quiz">
    <meta property="og:description" content="A fast-paced, modern local multiplayer music quiz using real iTunes songs.">
    <!-- WICHTIG: Die URL für og:image MUSS absolut sein, da Messenger-Crawler keine relativen Pfade (/og-image.png) lesen können! -->
    <meta property="og:image" content="https://deinedomain.de/og-image.png">
    
    <!-- Twitter Meta Tags (werden auch von vielen Messengern als Fallback genutzt) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MelodyMatch: The Ultimate Music Quiz">
    <meta name="twitter:description" content="A fast-paced, modern local multiplayer music quiz using real iTunes songs.">
    <meta name="twitter:image" content="https://deinedomain.de/og-image.png">
    
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#ae35ff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MelodyMatch" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
